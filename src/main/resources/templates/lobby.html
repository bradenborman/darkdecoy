<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Dark Decoy — Game Lobby</title>
    <style>
    :root {
      --accent: #00ffcc;
      --secondary: #5c5cff;
      --bg: #0d0d0d;
      --panel: #181818;
      --text: #f5f5f5;
      --subtext: #aaa;
    }

    * { box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", Arial, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    header { text-align: center; margin-bottom: 2rem; }

    h1 {
      font-size: 2.5rem;
      margin: 0;
    }

    .game-info {
      background: var(--panel);
      padding: 1.5rem 2rem;
      border-radius: 12px;
      text-align: center;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 0 15px rgba(255,255,255,0.05);
    }

    .game-code {
      font-size: 1.3rem;
      color: var(--accent);
      letter-spacing: 2px;
      margin: 0.5rem 0;
    }

    .mode {
      font-weight: 600;
      color: var(--secondary);
      margin-bottom: 0.4rem;
    }

    .description {
      color: var(--subtext);
      font-size: 0.95rem;
      margin-top: 0.4rem;
    }

    hr {
      border: none;
      border-top: 1px solid #333;
      margin: 2rem 0;
      width: 100%;
      max-width: 500px;
    }

    .card {
      background: var(--panel);
      padding: 1.8rem 2rem;
      border-radius: 14px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 0 10px rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    h3 {
      text-align: center;
      margin-top: 0;
      color: var(--accent);
    }

    .waiting {
      background: var(--panel);
      padding: 1rem;
      border-radius: 10px;
      text-align: center;
      color: var(--subtext);
      margin-top: 1rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      width: 100%;
    }

    input, button {
      width: 100%;
      padding: 0.9rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
    }

    input {
      background: #2b2b2b;
      color: var(--text);
    }

    input::placeholder { color: #777; }

    button {
      background: var(--secondary);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover { background: #7878ff; }

    button:disabled {
      background: #333;
      cursor: not-allowed;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
      color: var(--subtext);
      margin-top: 0.3rem;
      cursor: pointer;
    }

    .checkbox-container input[type="checkbox"] {
      accent-color: var(--secondary);
      width: 1.1rem;
      height: 1.1rem;
      cursor: pointer;
    }

    footer {
      color: var(--subtext);
      font-size: 0.8rem;
      text-align: center;
      margin-top: auto;
      padding-top: 2rem;
    }

    @media (max-width: 600px) {
      .game-info, .card {
        width: 95%;
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
<header>
    <h1>Dark Decoy</h1>
</header>

<div class="game-info">
    <div class="game-code" th:text="'Game Code: ' + ${lobby.id}"></div>
    <div class="mode" th:text="'Mode: ' + ${modeDisplay}"></div>
    <p class="description" th:text="${modeDescription}"></p>
</div>

<hr>

<section class="card">
    <h3 id="playerCountHeader">
        Players Connected: <span id="playerCount" th:text="${#lists.size(lobby.players)}">0</span>
    </h3>
    <p style="color:#777;font-size:0.9em;text-align:center;">⚠️ Don’t refresh — you’ll leave the game.</p>

    <div th:if="${lobby != null and playerId != null and playerId == lobby.hostId}">
        <form action="/start" method="post" th:if="${lobby != null and lobby.gameStarted != true}">
            <input type="hidden" id="lobbyId" name="lobbyId" th:value="${lobby.id}">
            <input type="hidden" id="playerId" name="playerId" th:value="${playerId}">
            <input name="prompt" placeholder="Enter main word/prompt" required>

            <div th:if="${lobby.mode == 'decoy'}">
                <input name="decoyPrompt" placeholder="Enter decoy word (for impostor)">
                <label class="checkbox-container">
                    <input type="checkbox" name="impostorKnows" checked>
                    Impostor knows they’re the impostor
                </label>
            </div>

            <button id="startButton" type="submit" disabled>Need 4+ players to start</button>
        </form>
    </div>

    <div th:if="${lobby != null and playerId != null and playerId != lobby.hostId}" class="waiting">
        Waiting for host to start the game...
    </div>
</section>

<footer>
    Dark Decoy © 2025 — A social deception game for friends
</footer>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script>
  const lobbyId = document.getElementById("lobbyId") ? document.getElementById("lobbyId").value : "[[${lobby.id}]]";
  const playerId = "[[${playerId}]]";
  const startButton = document.getElementById("startButton");
  const playerCount = document.getElementById("playerCount");
  let stompClient = null;
  let redirected = false;

  function connect() {
    const socket = new SockJS('/ws');
    stompClient = Stomp.over(socket);

    stompClient.connect({}, () => {
      stompClient.subscribe('/topic/lobbyUpdates', (message) => {
        const lobby = JSON.parse(message.body);
        if (lobby.id === lobbyId) updatePlayerCount(lobby.players);
      });
      stompClient.subscribe('/topic/gameStart', (message) => {
        if (redirected) return;
        const lobby = JSON.parse(message.body);
        if (lobby.id === lobbyId) {
          redirected = true;
          window.location.href = `/round?lobbyId=${lobbyId}&playerId=${playerId}`;
        }
      });
    });
  }

  function updatePlayerCount(players) {
    if (playerCount) playerCount.textContent = players.length;
    if (startButton) {
      if (players.length < 4) {
        startButton.disabled = true;
        startButton.textContent = "Need 4+ players to start";
      } else {
        startButton.disabled = false;
        startButton.textContent = "Start Game";
      }
    }
  }

  connect();
</script>
</body>
</html>
