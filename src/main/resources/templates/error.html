<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Error - Dark Decoy</title>
  <style>
        body {
            background-color: #111;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .error-box {
            background-color: #1c1c1c;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
            max-width: 500px;
        }
        h1 {
            color: #ff6666;
        }
        p {
            color: #bbb;
            margin-top: 10px;
        }
        button {
            background-color: #5c5cff;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            margin-top: 20px;
            cursor: pointer;
        }
        button:hover {
            background-color: #7878ff;
        }
    </style>
</head>
<body>
<div class="error-box">
  <h1>Oops!</h1>
  <p th:text="${errorMessage}">Something went wrong.</p>
  <button onclick="window.location.href='/'">Return Home</button>
</div>
</body>
</html>
